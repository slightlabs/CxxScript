name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release

      - name: Install to staging directory
        run: cmake --install build --config Release --prefix install-${{ matrix.os }}

      - name: Package artifact
        shell: bash
        run: tar -czf CxxScript-${{ github.ref_name }}-${{ matrix.os }}.tar.gz -C install-${{ matrix.os }} .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CxxScript-${{ matrix.os }}
          path: CxxScript-${{ github.ref_name }}-${{ matrix.os }}.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
